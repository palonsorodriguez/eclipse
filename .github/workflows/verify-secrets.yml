name: Verify Secrets

# End-to-end check that the repository secrets actually work, before you spend
# an agent run finding out they don't. Run it from Actions → Verify Secrets →
# Run workflow. Read-only: it creates no branches, issues, or comments.
#
# Safe to delete once the setup is proven.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check both secrets are present and non-empty
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: |
          set -euo pipefail
          fail=0
          # Lengths only — GitHub masks the values themselves in logs.
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set"
            fail=1
          else
            echo "CLAUDE_CODE_OAUTH_TOKEN present (${#CLAUDE_CODE_OAUTH_TOKEN} chars)"
            case "$CLAUDE_CODE_OAUTH_TOKEN" in
              sk-ant-oat*) ;;
              *) echo "::warning::CLAUDE_CODE_OAUTH_TOKEN does not start with sk-ant-oat — is this an API key rather than an OAuth token?" ;;
            esac
            # A trailing newline pasted into the secret box breaks the header.
            case "$CLAUDE_CODE_OAUTH_TOKEN" in
              *[[:space:]]) echo "::error::CLAUDE_CODE_OAUTH_TOKEN has trailing whitespace"; fail=1 ;;
            esac
          fi
          if [ -z "${AGENT_PAT:-}" ]; then
            echo "::error::AGENT_PAT is not set"
            fail=1
          else
            echo "AGENT_PAT present (${#AGENT_PAT} chars)"
            case "$AGENT_PAT" in
              *[[:space:]]) echo "::error::AGENT_PAT has trailing whitespace"; fail=1 ;;
            esac
          fi
          exit $fail

      - name: AGENT_PAT — identity and repository write permissions
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Authenticated as: $(gh api /user --jq .login)"

          # Non-destructive permission probes: an empty body means a granted
          # permission returns 422 (validation) and a missing one returns 403.
          probe() {
            status=$(curl -s -o /dev/null -w '%{http_code}' -X "$2" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d '{}' "https://api.github.com$3")
            case "$status" in
              422) echo "  $1: granted" ;;
              403|404) echo "::error::  $1: DENIED (HTTP $status)"; return 1 ;;
              *) echo "::warning::  $1: unexpected HTTP $status" ;;
            esac
          }

          echo "Repository permissions:"
          rc=0
          probe "contents:write"      POST "/repos/$REPO/git/blobs" || rc=1
          probe "issues:write"        POST "/repos/$REPO/labels" || rc=1
          probe "pull-requests:write" POST "/repos/$REPO/pulls" || rc=1
          exit $rc

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: CLAUDE_CODE_OAUTH_TOKEN — live authentication
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          out=$(claude -p "Reply with exactly: TOKEN_OK" --model haiku 2>&1)
          echo "$out"
          if ! echo "$out" | grep -q "TOKEN_OK"; then
            echo "::error::Claude Code could not authenticate with CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi
          echo "Claude Code authenticated."

      - name: Summary
        run: echo "Both secrets verified. You can delete .github/workflows/verify-secrets.yml."
